name: crawl-ops

services:
  backend:
    build: ./backend
    image: crawl-ops-backend:latest
    environment:
      DATABASE_URL: "mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:?必须设置 MYSQL_ROOT_PASSWORD}@db:3306/crawlops?charset=utf8mb4"
      REDIS_URL: "redis://:${REDIS_PASSWORD:?必须设置 REDIS_PASSWORD}@redis:6379/0"
      WORKER_REGISTRATION_TOKEN: "crawlops-local-worker"
      PROXY_CRAWLING_ENABLED: "false"
      CORS_ORIGINS: '["http://localhost:18080"]'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./data/projects:/app/data/projects
      - ./data/logs:/app/data/logs
      - ./data/venvs:/app/data/venvs
    ports:
      - "127.0.0.1:18081:18081"
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: crawl-ops-frontend:latest
    depends_on:
      backend:
        condition: service_started
    # 仅绑定本机；公网部署请在反向代理上配置 TLS 和访问控制。
    ports:
      - "127.0.0.1:18080:80"
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?必须设置 MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "crawlops"
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8.0-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?必须设置 REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
