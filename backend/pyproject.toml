[tool.poetry]
name = "crawlops-backend"
version = "1.0.0"
description = "分布式采集任务控制与运维平台后端服务"
authors = ["CrawlOps Contributors"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.140.13"
uvicorn = {extras = ["standard"], version = "^0.51.0"}
python-multipart = "^0.0.32"
sqlalchemy = "^2.0.51"
pymysql = "^1.2.0"
alembic = "^1.13.1"
redis = "^5.0.1"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
pydantic = {extras = ["email"], version = "^2.13.4"}
pydantic-settings = "^2.1.0"
apscheduler = "^3.11.3"
httpx = "^0.28.1"
aiofiles = ">=23.2.1,<26.0.0"
loguru = "^0.7.3"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
httpx = "^0.28.1"
black = "^26.3.1"
isort = "^5.13.2"
mypy = "^1.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
