[project]
name = "crawlops-backend"
version = "1.0.0"
description = "分布式采集任务控制与运维平台后端服务"
authors = [{name = "CrawlOps Contributors"}]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dynamic = ["dependencies"]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.141.1"
uvicorn = {extras = ["standard"], version = "^0.52.3"}
python-multipart = "^0.0.32"
sqlalchemy = "^2.0.52"
pymysql = "^1.2.0"
alembic = "^1.20.0"
redis = "^8.1.0"
bcrypt = "^5.0.0"
pydantic = {extras = ["email"], version = "^2.13.4"}
pydantic-settings = "^2.15.0"
apscheduler = "^3.11.3"
pytz = "^2026.3.post1"
httpx = "^0.28.1"
loguru = "^0.7.3"
psutil = "^7.2.2"
requests = "^2.34.2"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
httpx = "^0.28.1"
black = "^26.5.1"
isort = "^8.0.1"
mypy = "^2.3.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
explicit_package_bases = true
